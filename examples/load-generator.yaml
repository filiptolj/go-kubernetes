# Sends requests to php-apache (see autoscaling.yaml) as fast as it can,
# through the Service, from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: main
    image: busybox:1.36
    command: ["sh", "-c", "while true; do wget -q -O- http://php-apache:8082 >/dev/null; done"]

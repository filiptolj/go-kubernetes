# Sends http://shop.local:8090/ to the web Service. Apply web-deployment.yaml
# and web-service.yaml first, then:
#   curl -H "Host: shop.local" http://localhost:8090/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  rules:
  - host: shop.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 8081

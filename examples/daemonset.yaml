apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: agent
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo watching node $NODE_NAME; sleep 10; done"]

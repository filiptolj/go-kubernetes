# A pod whose init container writes a web page before nginx starts, and
# whose readiness probe runs a command inside the container.
apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    app: init-demo
spec:
  volumes:
  - name: html
    emptyDir: {}
  initContainers:
  - name: write-page
    image: busybox:1.36
    command: ["sh", "-c", "echo '<h1>written by an init container</h1>' > /html/index.html"]
    volumeMounts:
    - name: html
      mountPath: /html
  containers:
  - name: web
    image: nginx:1.27
    ports:
    - containerPort: 80
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html
    readinessProbe:
      exec:
        command: ["test", "-f", "/usr/share/nginx/html/index.html"]
      periodSeconds: 2
